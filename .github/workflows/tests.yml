name: CoffeeShop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      userdb:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coffee_user
          POSTGRES_DB: coffee_shop
          POSTGRES_PASSWORD: coffee_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffee_user -d coffee_shop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: mvn clean verify
        env:
          POSTGRES_USER: coffee_user
          POSTGRES_PASSWORD: coffee_pass
          POSTGRES_DB: coffee_shop
